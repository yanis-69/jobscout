name: Tests

on:
  push:
    # « verif/** » : branches de vérification, testées avant d'arriver sur main.
    branches: [main, "verif/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Mac à puce Apple (arm64).
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 26 : future LTS (28/10/2026), proposée par le gros bouton de nodejs.org.
        node: ["22", "24", "26"]
        include:
          # Mac Intel (x64).
          - os: macos-15-intel
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests automatiques
        run: npm test
      - name: Build de production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Le parcours du guide d'installation Mac (INSTALL-MAC.md), sur une machine vierge :
  # npm ci, npm run dev, pages de l'application, moteur LinkedIn installé par le bouton
  # de l'application puis lancé, lanceur « npm run shortcut:mac ».
  installation-macos:
    name: Installation sous macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Système
        run: |
          sw_vers; uname -m; node -v; npm -v
          echo "::notice title=Système (${{ matrix.os }})::macOS $(sw_vers -productVersion), $(uname -m), Node $(node -v), npm $(npm -v)"
      - name: npm ci (durée mesurée)
        run: |
          start=$(date +%s)
          npm ci 2>&1 | tee npmci.log
          echo "Durée de npm ci : $(( $(date +%s) - start )) s"
          added=$(grep -E "^added [0-9]+ packages" npmci.log)
          echo "$added"
          echo "::notice title=npm ci (${{ matrix.os }})::$(( $(date +%s) - start )) s — $added"
      - name: npm run dev et pages principales
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:3000 && break; sleep 1; done
          # Sans session : la page de connexion ; puis connexion par nom d'utilisateur (cookie dans cookies.txt).
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 180 http://127.0.0.1:3000/login)
          echo "/login -> HTTP $code"; [ "$code" = 200 ] || { cat dev.log; exit 1; }
          curl -s -f -c cookies.txt -H 'content-type: application/json' -d '{"name":"CI"}' http://127.0.0.1:3000/api/auth/login || { cat dev.log; exit 1; }; echo
          for p in / /onboarding/upload /api/engine; do
            code=$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' -m 180 "http://127.0.0.1:3000$p")
            echo "$p -> HTTP $code"
            case "$code" in 200|307|308) ;; *) cat dev.log; exit 1 ;; esac
          done
      - name: Moteur LinkedIn installé par le bouton de l'application
        run: |
          start=$(date +%s)
          curl -s -b cookies.txt -X POST -H "Origin: http://127.0.0.1:3000" http://127.0.0.1:3000/api/engine; echo
          for i in $(seq 1 120); do
            state=$(curl -s -b cookies.txt http://127.0.0.1:3000/api/engine)
            echo "$state" | grep -q '"installed":true' && break
            echo "$state" | grep -q '"error":"' && { echo "$state"; cat dev.log; exit 1; }
            sleep 5
          done
          echo "$state"
          echo "$state" | grep -q '"installed":true' || { cat dev.log; exit 1; }
          echo "Durée de l'installation du moteur : $(( $(date +%s) - start )) s"
          echo "::notice title=Moteur LinkedIn (${{ matrix.os }})::installé par le bouton en $(( $(date +%s) - start )) s ; $(du -sh data/browsers | cut -f1) sur le disque"
      - name: Moteur LinkedIn lancé (Chromium sans fenêtre)
        # Le bouton de l'application l'installe dans data/browsers (lib/scrapers/browser-engine.ts).
        run: |
          ls data/browsers
          PLAYWRIGHT_BROWSERS_PATH="$PWD/data/browsers" node -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch();
              const p = await b.newPage();
              await p.goto('data:text/html,<h1>ok</h1>');
              console.log('Chromium', b.version(), '->', await p.textContent('h1'));
              await b.close();
            })().catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Lanceur Mac (npm run shortcut:mac)
        run: |
          npm run shortcut:mac
          test -x JobScout.command
          zsh -n JobScout.command
          head -4 JobScout.command
      - name: Journal du serveur
        if: always()
        run: cat dev.log || true
